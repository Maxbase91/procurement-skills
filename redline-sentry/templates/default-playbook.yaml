# Default playbook — read-only reference
# This is a copy of the shipped defaults. If config.yaml is missing or you
# want to know "what would the default say", read this file.
# DO NOT edit this file. Edit config.yaml instead.

# (Same content as config.yaml ships with — kept here as a stable reference
# so users can always restore defaults by copying this over config.yaml.)

# See ../config.yaml for the full structure with comments.
# Key defaults:
#   - English law primary
#   - Contract value threshold: €50,000
#   - Liability cap minimum: 12 months fees
#   - Data breach: uncapped or super-cap
#   - IP indemnity: required, mutual preferred
#   - DPA required if personal data processed
#   - Sub-processor: prior approval required
#   - Data breach notification: 24h max
#   - Termination for convenience: required, 90 day max notice
#   - Payment: NET-30 preferred, NET-60 acceptable
#   - Price increases: 5% annual cap or CPI-linked
#   - SaaS uptime: 99.5% minimum, service credits required
#   - Customer owns data, no training-on-data clauses
#   - NDA max term: 3 years
