name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Check shell tools
        run: command -v shellcheck zip unzip

      - name: Validate skills and install.sh
        run: python scripts/validate.py

      - name: Shellcheck test scripts
        run: shellcheck scripts/test-install.sh scripts/test-validate.sh

      - name: Validator tests (temp dir)
        run: ./scripts/test-validate.sh

      - name: Installer tests (temp dir)
        run: ./scripts/test-install.sh
